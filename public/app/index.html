<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bush Taxi Management System</title><style>
:root{--bg:#08090b;--panel:#121419;--panel2:#181b21;--line:#2b3038;--gold:#d4af37;--gold2:#f3d76d;--text:#f5f5f6;--muted:#9ca3ad;--green:#35c58a;--red:#ef6464;--shadow:0 20px 70px #0009}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#3a2d08 0,#0b0c0f 32%,#07080a 70%);color:var(--text);font:14px Inter,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:255px 1fr;min-height:100vh}.side{background:#0b0d10;border-right:1px solid var(--line);padding:18px 13px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px;border-bottom:1px solid var(--line)}.brand img{width:48px;height:48px;border-radius:50%;object-fit:contain;background:white;padding:3px}.brand b{font-size:13px}.brand small{display:block;color:var(--gold);margin-top:4px}.nav{padding-top:14px}.nav button{width:100%;border:0;background:transparent;color:#c9cbd0;text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0}.nav button.active,.nav button:hover{background:#1b1912;color:#fff;box-shadow:inset 3px 0 var(--gold)}.ico{display:inline-block;width:25px;color:var(--gold)}.sidefoot{position:absolute;bottom:15px;color:#70757e;font-size:11px;padding:0 8px}.main{min-width:0}.top{height:70px;position:sticky;top:0;z-index:5;background:#0c0e11dd;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 28px}.crumb{color:var(--muted)}.crumb b{color:#fff}.user{display:flex;gap:10px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#211d0c;border:1px solid #6b5820;color:var(--gold)}.content{max-width:1600px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:20px}.head h1{margin:0;font-size:28px}.head p{margin:7px 0 0;color:var(--muted);font-size:12px}.btn{border:1px solid #3b4048;background:#181b20;color:#fff;padding:10px 14px;border-radius:9px}.btn:hover{border-color:#88722b}.btn.gold{background:linear-gradient(135deg,#e0bb43,#9f7e17);color:#090909;border-color:#d4af37;font-weight:800}.btn.red{color:#ffadad;border-color:#6a3030}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:linear-gradient(180deg,#15181e,#101216);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.metric .label{color:var(--muted);font-size:11px}.metric .num{font-size:28px;font-weight:800;margin-top:8px}.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:14px}.section{margin-top:18px}.section h2{font-size:16px;margin:0 0 12px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px 12px;text-align:left;border-bottom:1px solid #272b31;font-size:12px}.table th{color:#a7abb3;background:#15181d}.table tr:hover td{background:#16191e}.badge{display:inline-flex;border:1px solid #3b4048;border-radius:999px;padding:4px 8px;font-size:10px}.ok{color:#8be2ba!important;border-color:#245b47!important;background:#0e241b}.warn{color:#ffd39b!important;border-color:#6a4824!important;background:#251b0f}.bad{color:#ffaaaa!important;border-color:#642f2f!important;background:#241112}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:#9da2aa;text-transform:uppercase}.field input,.field select,.field textarea{background:#0c0e11;color:#fff;border:1px solid #363b43;border-radius:9px;padding:10px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#8a7327}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}.search{display:flex;gap:10px}.search input{flex:1}.results{display:grid;gap:8px;margin-top:10px}.result{display:flex;justify-content:space-between;align-items:center;padding:11px;background:#12151a;border:1px solid #292e36;border-radius:9px;transition:.15s}.result:hover{border-color:#8a7327;transform:translateY(-1px)}.result.clickable{cursor:pointer}.smartbox{margin-top:14px;padding:14px;border:1px solid #3a3421;border-radius:11px;background:linear-gradient(180deg,#17150f,#101216)}.smartbox b{color:var(--gold2)}.hint{color:var(--muted);font-size:11px}.empty{text-align:center;padding:35px;color:#727780}.toast{position:fixed;right:20px;bottom:20px;background:#16191e;border:1px solid #3d424a;border-radius:9px;padding:13px 16px;display:none;z-index:20}.toast.show{display:block}.globalSearch{position:relative;width:min(560px,42vw);margin:0 24px}.globalSearchBox{display:flex;align-items:center;gap:8px;background:#111419;border:1px solid #3a3e45;border-radius:10px;padding:7px 10px}.globalSearchBox:focus-within{border-color:#a8892d;box-shadow:0 0 0 2px #d4af3718}.globalSearchBox input{width:100%;background:transparent;border:0;outline:0;color:#fff;font-size:12px}.aiTag{font-size:10px;font-weight:800;color:#f3d76d;white-space:nowrap}.globalDropdown{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#111419;border:1px solid #3b4048;border-radius:12px;box-shadow:0 25px 70px #000c;overflow:hidden;z-index:30;display:none}.globalDropdown.show{display:block}.globalDropdown .dropHead{padding:10px 12px;border-bottom:1px solid #292e36;color:#9ca3ad;font-size:10px}.globalDropdown .result{border:0;border-radius:0;border-bottom:1px solid #252a31}.globalDropdown .result:last-child{border-bottom:0}.globalDropdown .result:hover{background:#191a16;transform:none}.globalDropdown .empty{padding:22px}.searchMeta{color:#70757e;font-size:10px;margin-left:8px}@media(max-width:1000px){.globalSearch{width:34vw;margin:0 12px}}@media(max-width:700px){.globalSearch{position:absolute;left:55px;right:12px;width:auto;margin:0}.top{position:relative}}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:#111419;border:1px solid #3b3830;border-radius:20px;padding:30px;box-shadow:0 30px 100px #000c}.loginbox img{width:85px;height:85px;display:block;margin:auto;background:white;border-radius:50%;padding:5px}.loginbox h1{text-align:center;margin:16px 0 5px;font-size:22px}.loginbox p{text-align:center;color:var(--muted);font-size:12px;margin:0 0 20px}.loginbox .field{margin-top:12px}.loginbox .btn{width:100%;margin-top:16px}.mobile{display:none}.print{background:white;color:#111;width:80mm;padding:18px;font-family:Arial}.print h2{font-size:15px;text-align:center;margin:0}.print .c{text-align:center}.print hr{border:0;border-top:1px dashed #555}.print table{width:100%;font-size:11px}.print td:last-child{text-align:right}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.formgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:10;left:-275px;width:255px;transition:.2s}.side.open{left:0}.mobile{display:inline-block}.top{padding:0 14px}.content{padding:18px 14px}.cards{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.head{flex-direction:column;align-items:flex-start}}
</style></head><body><div id="root"></div><div id="toast" class="toast"></div><script>
const API='https://yggulrbjofnrjcecmern.supabase.co/functions/v1/bush-taxi-api';const logo='bta-logo.png';let admin={display_name:'Bush Taxi User'};let page='dashboard',routes=[];const root=document.getElementById('root');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=x=>'R '+Number(x||0).toLocaleString('en-ZA',{minimumFractionDigits:2});const dt=x=>x?new Date(x).toLocaleString('en-ZA',{dateStyle:'medium',timeStyle:'short'}):'—';function toast(x){let t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}async function api(path,opt={}){let h={'Content-Type':'application/json',...(opt.headers||{})};let r=await fetch(API+path,{...opt,headers:h});let d=await r.json().catch(()=>({}));if(!r.ok||d.success===false){let msg=d.error;throw Error(typeof msg==='string'?msg:(msg?.message||JSON.stringify(msg)||'Request failed'))}return d}
function nav(){return [['dashboard','⌂','Dashboard'],['members','♙','Members'],['new-member','＋','New Member'],['vehicles','▣','Vehicles'],['routes','⌁','Routes'],['payments','R','Payments'],['receipts','▤','Receipts'],['penalties','!','Penalties'],['funeral','♥','Funeral Plans'],['reports','◫','Reports']].map(a=>`<button class="${page===a[0]?'active':''}" onclick="go('${a[0]}')"><span class="ico">${a[1]}</span>${a[2]}</button>`).join('')}
function shell(body,title){root.innerHTML=`<div class="app"><aside class="side" id="side"><div class="brand"><img src="${logo}"><div><b>BUSH TAXI</b><small>MANAGEMENT SYSTEM</small></div></div><nav class="nav">${nav()}</nav><div class="sidefoot">Dedicated schema: <b>bush_taxi</b><br>Independent BTA database</div></aside><main class="main"><header class="top"><div><button class="btn mobile" onclick="document.getElementById('side').classList.toggle('open')">☰</button> <span class="crumb"><b>BUSH TAXI</b> / ${esc(title)}</span></div><div class="globalSearch"><div class="globalSearchBox"><span class="aiTag">✦ AI SEARCH</span><input id="globalMemberSearchInput" autocomplete="off" placeholder="Search all members by name, ID, phone, route or member no..." oninput="runGlobalMemberSearch()" onfocus="runGlobalMemberSearch()"><span class="searchMeta">⌄</span></div><div id="globalMemberDropdown" class="globalDropdown"></div></div><div class="user"><span>Bush Taxi Management</span><span class="avatar">BT</span></div></header><section class="content">${body}</section></main></div>`}
async function dashboard(){let d;try{d=await api('/dashboard')}catch(e){d={members:0,vehicles:0,routes:0,total_collections:0};toast('Database connection error: '+e.message)}shell(`<div class="head"><div><h1>Dashboard</h1><p>Live overview of the Bush Taxi Association management system.</p></div><button class="btn gold" onclick="go('new-member')">＋ Register Member</button></div><div class="cards">${[['MEMBERS',d.members],['VEHICLES',d.vehicles],['ROUTES',d.routes],['COLLECTIONS',money(d.total_collections)]].map(x=>`<div class="card metric"><div><div class="label">${x[0]}</div><div class="num">${x[1]}</div></div></div>`).join('')}</div><div class="grid2"><div class="card"><h2>System Modules</h2><div class="formgrid"><div class="detail">Members & Vehicles</div><div class="detail">Routes & Fees</div><div class="detail">Payments & Receipts</div><div class="detail">Penalties</div><div class="detail">Funeral Plans</div><div class="detail">Reports</div></div></div><div class="card"><h2>Database</h2><p class="muted">All records are stored in the dedicated <b>bush_taxi</b> schema. The former public BTA tables are not used.</p></div></div>`,'Dashboard')}
async function members(){let d=await api('/members');cacheMembers(d.members||[]);shell(`<div class="head"><div><h1>Members</h1><p>Search every member field automatically with smart fuzzy matching.</p></div><button class="btn gold" onclick="go('new-member')">＋ New Member</button></div><div class="card"><div class="search"><input id="mq" placeholder="AI Smart Search: name, surname, ID, phone, route, municipality, email, member no..." oninput="autoMemberSearch()"><button class="btn" onclick="loadMembers()">Search</button></div><div class="smartbox"><b>✦ Smart Member Search</b><div class="hint">Type any part of a member's details. Results update automatically and search across the complete member profile.</div><div id="mr" class="results">${memberResults(d.members||[])}</div></div><div class="tablewrap section"><table class="table"><thead><tr><th>Member No.</th><th>Name</th><th>ID Number</th><th>Phone</th><th>Route</th><th>Municipality</th><th>Status</th></tr></thead><tbody id="mt">${memberRows(d.members||[])}</tbody></table></div></div>`,'Members')}
function cacheMembers(a){memberCache={};(a||[]).forEach(m=>memberCache[m.id]=m)}
function memberName(m){return [m.first_names,m.surname].filter(Boolean).join(' ')||m.surname||'Unnamed member'}
function memberResults(a){return a?.length?a.slice(0,20).map(m=>`<div class="result clickable" onclick="openMember('${esc(m.id)}')"><div><b>${esc(memberName(m))}</b><div class="hint">Member ${esc(m.member_number||'—')} • ID ${esc(m.id_number||'—')} • ${esc(m.phone||'No phone')}</div><div class="hint">${esc(m.route_taxi_line||m.routes?.route_name||'No route')} • ${esc(m.municipality||'No municipality')}</div></div><span class="badge ${m.status==='active'?'ok':'warn'}">${esc(m.status)}</span></div>`).join(''):`<div class="empty">No matching members found.</div>`}
function memberRows(a){return a?.length?a.map(m=>`<tr onclick="openMember('${esc(m.id)}')" style="cursor:pointer"><td><b>${esc(m.member_number||'—')}</b></td><td>${esc(memberName(m))}</td><td>${esc(m.id_number||'—')}</td><td>${esc(m.phone||'—')}</td><td>${esc(m.route_taxi_line||m.routes?.route_name||'—')}</td><td>${esc(m.municipality||'—')}</td><td><span class="badge ${m.status==='active'?'ok':'warn'}">${esc(m.status)}</span></td></tr>`).join(''):`<tr><td colspan="7" class="empty">No members found.</td></tr>`}
let memberCache={};let memberSearchTimer=null;let globalSearchTimer=null;
function runGlobalMemberSearch(){clearTimeout(globalSearchTimer);globalSearchTimer=setTimeout(async()=>{let el=document.getElementById("globalMemberSearchInput"),box=document.getElementById("globalMemberDropdown");if(!el||!box)return;let q=el.value.trim();if(!q){box.classList.remove("show");box.innerHTML="";return}box.classList.add("show");box.innerHTML='<div class="dropHead">✦ AI matching members…</div><div class="empty">Searching all member records</div>';try{let d=await api('/members?q='+encodeURIComponent(q));let a=d.members||[];cacheMembers(a);box.innerHTML='<div class="dropHead">✦ AI Member Search <span class="searchMeta">'+a.length+' match'+(a.length===1?'':'es')+'</span></div>'+(a.length?memberResults(a.slice(0,8)):'<div class="empty">No matching members found.</div>');box.classList.add("show")}catch(e){box.innerHTML='<div class="empty">Search error: '+esc(e.message||e)+'</div>'}},120)}
document.addEventListener("click",e=>{const t=e.target;const inside=t&&t.closest?t.closest(".globalSearch"):null;if(!inside){const box=document.getElementById("globalMemberDropdown");if(box)box.classList.remove("show")}});
async function loadMembers(){let q=(mq?.value||'').trim();let d=await api('/members?q='+encodeURIComponent(q));cacheMembers(d.members||[]);if(mt)mt.innerHTML=memberRows(d.members||[]);if(mr)mr.innerHTML=memberResults(d.members||[])}
function autoMemberSearch(){clearTimeout(memberSearchTimer);memberSearchTimer=setTimeout(()=>loadMembers().catch(e=>toast(e.message)),180)}
function closeGlobalDropdown(){let box=document.getElementById('globalMemberDropdown');if(box){box.classList.remove('show');box.innerHTML=''}let gi=document.getElementById('globalMemberSearchInput');if(gi)gi.value=''}
function hasClientForm(){return !!(document.getElementById('pf')&&document.getElementById('pmember'))}
function useMember(m){if(!m)return toast('Member record could not be loaded');closeGlobalDropdown();if(hasClientForm())return selectMember(m);return editMember(m)}
function openMember(id){let m=memberCache[id];if(m)return useMember(m);api('/members?id='+encodeURIComponent(id)).then(d=>{let a=d.members||[];let x=a.find(y=>String(y.id)===String(id))||a[0];if(x)memberCache[x.id]=x;useMember(x)}).catch(e=>toast(e.message))}
async function editMember(m){await newMember(m)}
async function newMember(existing=null){let rd=routes?.length?{routes}:await api('/routes');routes=rd.routes||[];let m=existing||{};shell(`<div class="head"><div><h1>${existing?'Edit Member':'Register New Member'}</h1><p>${existing?'Review or update the selected member.':'Create a Bush Taxi Association member record.'}</p></div><div><button class="btn" onclick="go('members')">← Back to Members</button></div></div><div class="card"><div class="smartbox"><b>✦ Find an Existing Member</b><div class="hint">Search automatically, then click a result to load that member into this form.</div><div class="search" style="margin-top:9px"><input id="memberLookup" placeholder="Search by name, surname, ID, phone, route, municipality, email or member number" oninput="autoFormMemberSearch()"></div><div id="memberLookupResults" class="results"></div></div><form id="mf" style="margin-top:18px"><input type="hidden" id="member_id" value="${esc(m.id||'')}"><div class="formgrid"><div class="field"><label>Member Number</label><input id="member_number" value="${esc(m.member_number||'')}" ${existing?'':'placeholder="Auto-generated if blank"'}></div><div class="field"><label>Initials</label><input id="initials" value="${esc(m.initials||'')}"></div><div class="field"><label>Surname *</label><input id="surname" value="${esc(m.surname||'')}" required></div><div class="field"><label>First Names</label><input id="first_names" value="${esc(m.first_names||'')}"></div><div class="field"><label>ID Number</label><input id="id_number" value="${esc(m.id_number||'')}"></div><div class="field"><label>Phone</label><input id="phone" value="${esc(m.phone||'')}"></div><div class="field"><label>Email</label><input id="email" type="email" value="${esc(m.email||'')}"></div><div class="field"><label>Province</label><input id="province" value="${esc(m.province||'Mpumalanga')}"></div><div class="field"><label>Municipality</label><input id="municipality" value="${esc(m.municipality||'')}"></div><div class="field"><label>Route / Taxi Line</label><select id="route_id"><option value="">— Select route —</option>${routes.map(r=>`<option value="${esc(r.id)}" ${m.route_id===r.id?'selected':''}>${esc(r.route_name)}${r.route_code?' ('+esc(r.route_code)+')':''}</option>`).join('')}</select></div><div class="field"><label>Route / Taxi Line Text</label><input id="route_taxi_line" value="${esc(m.route_taxi_line||m.routes?.route_name||'')}"></div><div class="field"><label>Vehicle Count</label><input id="vehicle_count" type="number" min="0" value="${esc(m.vehicle_count??0)}"></div><div class="field"><label>Vehicle Registration</label><input id="vehicle_registration" value="${esc(m.vehicle_registration||'')}"></div><div class="field"><label>Employment Duration</label><input id="employment_duration" value="${esc(m.employment_duration||'')}"></div><div class="field"><label>Employment Start Date</label><input id="employment_start_date" type="date" value="${esc(m.employment_start_date||'')}"></div><div class="field"><label>Status</label><select id="status"><option value="active" ${m.status==='active'||!m.status?'selected':''}>active</option><option value="inactive" ${m.status==='inactive'?'selected':''}>inactive</option><option value="suspended" ${m.status==='suspended'?'selected':''}>suspended</option><option value="deceased" ${m.status==='deceased'?'selected':''}>deceased</option></select></div><div class="field full"><label>Address</label><textarea id="address">${esc(m.address||'')}</textarea></div><div class="field full"><label>Notes</label><textarea id="notes">${esc(m.notes||'')}</textarea></div></div><div class="actions"><button type="button" class="btn" onclick="go('members')">Cancel</button>${existing?'<button type="button" class="btn" onclick="go(\'new-member\')">＋ New Member</button>':''}<button class="btn gold">${existing?'Update Member':'Save Member'}</button></div></form></div>`,'New Member');mf.onsubmit=async e=>{e.preventDefault();let body={member_number:member_number.value.trim()||null,initials:initials.value.trim()||null,surname:surname.value.trim(),first_names:first_names.value.trim()||null,id_number:id_number.value.trim()||null,phone:phone.value.trim()||null,email:email.value.trim()||null,province:province.value.trim()||null,municipality:municipality.value.trim()||null,address:address.value.trim()||null,route_id:route_id.value||null,route_taxi_line:route_taxi_line.value.trim()||null,vehicle_count:Number(vehicle_count.value||0),vehicle_registration:vehicle_registration.value.trim()||null,employment_duration:employment_duration.value.trim()||null,employment_start_date:employment_start_date.value||null,status:status.value,notes:notes.value.trim()||null};try{let d=await api(existing?'/members?id='+encodeURIComponent(existing.id):'/members',{method:existing?'PUT':'POST',body:JSON.stringify(body)});toast(existing?'Member updated':'Member registered');go('members')}catch(e){toast(e.message)}}}
let formMemberSearchTimer=null;function autoFormMemberSearch(){clearTimeout(formMemberSearchTimer);formMemberSearchTimer=setTimeout(async()=>{let q=(memberLookup?.value||'').trim();if(!q){memberLookupResults.innerHTML='';return}try{let d=await api('/members?q='+encodeURIComponent(q));memberLookupResults.innerHTML=memberResults(d.members||[]);cacheMembers(d.members||[])}catch(e){toast(e.message)}},180)}
async function vehicles(){let d=await api('/vehicles');shell(`<div class="head"><div><h1>Vehicle Registry</h1><p>Taxi vehicles linked to association members.</p></div></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Registration</th><th>Owner</th><th>Make</th><th>Model</th><th>Permit</th><th>Status</th></tr></thead><tbody>${d.vehicles.length?d.vehicles.map(v=>`<tr><td><b>${esc(v.registration_number)}</b></td><td>${esc([v.members?.first_names,v.members?.surname].filter(Boolean).join(' ')||v.members?.surname)}</td><td>${esc(v.make||'—')}</td><td>${esc(v.model||'—')}</td><td>${esc(v.permit_number||'—')}</td><td><span class="badge ${v.status==='active'?'ok':'warn'}">${esc(v.status)}</span></td></tr>`).join(''):`<tr><td colspan="6" class="empty">No vehicles registered yet.</td></tr>`}</tbody></table></div></div>`,'Vehicles')}
async function routesPage(){let d=await api('/routes');routes=d.routes||[];shell(`<div class="head"><div><h1>Taxi Routes</h1><p>Manage active taxi lines, destinations and fees.</p></div></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Code</th><th>Route</th><th>Origin</th><th>Destination</th><th>Fee</th><th>Status</th></tr></thead><tbody>${routes.length?routes.map(r=>`<tr><td>${esc(r.route_code||'—')}</td><td><b>${esc(r.route_name)}</b></td><td>${esc(r.origin||'—')}</td><td>${esc(r.destination||'—')}</td><td>${money(r.fee_amount)}</td><td><span class="badge ${r.is_active?'ok':'bad'}">${r.is_active?'Active':'Inactive'}</span></td></tr>`).join(''):`<tr><td colspan="6" class="empty">No routes yet.</td></tr>`}</tbody></table></div></div>`,'Taxi Routes')}
async function payments(){let d=await api('/payments');shell(`<div class="head"><div><h1>Payments</h1><p>Record payments and issue official sequential receipts.</p></div></div><div class="card"><div class="search"><input id="ps" placeholder="Search member by surname, ID, phone or member number" autocomplete="off" oninput="autoPaySearch()"><button class="btn" onclick="findPay()">Find Member</button></div><div id="pr" class="results"></div><form id="pf" style="display:none;margin-top:15px"><input type="hidden" id="pmember"><div class="formgrid"><div class="field"><label>Selected Member</label><input id="pname" readonly></div><div class="field"><label>Amount (R)</label><input id="pamount" type="number" step="0.01" min="0.01" required></div><div class="field"><label>Payment Method</label><select id="pmethod"><option>cash</option><option>card</option><option>eft</option><option>mobile</option><option>other</option></select></div><div class="field"><label>Payment Type</label><select id="ptype"><option>membership</option><option>route</option><option>penalty</option><option>funeral_plan</option><option>other</option></select></div><div class="field"><label>Reference Number</label><input id="pref"></div><div class="field"><label>Received By</label><input id="pby" value="BTA Administrator"></div><div class="field full"><label>Notes</label><textarea id="pnotes"></textarea></div></div><div class="actions"><button class="btn gold">Capture Payment & Issue Receipt</button></div></form></div>`,'Payments');pf.onsubmit=async e=>{e.preventDefault();try{let d=await api('/payments',{method:'POST',body:JSON.stringify({member_id:pmember.value,amount:Number(pamount.value),payment_method:pmethod.value,payment_type:ptype.value,reference_number:pref.value||null,received_by:pby.value,notes:pnotes.value||null})});toast('Receipt '+d.receipt.receipt_number+' issued');printReceipt(d.receipt);go('receipts')}catch(e){toast(e.message)}}}
let paySearchTimer=null;function autoPaySearch(){clearTimeout(paySearchTimer);paySearchTimer=setTimeout(()=>findPay().catch(e=>toast(e.message)),180)}
async function findPay(){let el=document.getElementById('ps'),box=document.getElementById('pr');if(!el||!box)return;let q=(el.value||'').trim();if(!q){box.innerHTML='';return}let d=await api('/members?q='+encodeURIComponent(q));let a=(d.members||[]).slice(0,10);cacheMembers(d.members||[]);box.innerHTML=a.map(m=>`<div class="result clickable" onclick="openMember('${esc(m.id)}')"><div><b>${esc(memberName(m))}</b><div class="muted">${esc(m.id_number||'No ID')} • ${esc(m.member_number||'')}</div></div><button class="btn" type="button" onclick="event.stopPropagation();openMember('${esc(m.id)}')">Select</button></div>`).join('')||'<div class="empty">No member found.</div>'}
function selectMember(m){let mi=document.getElementById('pmember'),nm=document.getElementById('pname'),form=document.getElementById('pf'),box=document.getElementById('pr'),ps2=document.getElementById('ps');if(!mi||!form)return editMember(m);mi.value=m.id;if(nm)nm.value=memberName(m);form.style.display='block';if(box)box.innerHTML='';if(ps2)ps2.value='';toast('Client loaded: '+memberName(m));form.scrollIntoView({behavior:'smooth',block:'nearest'})}
async function receipts(){let d=await api('/receipts');shell(`<div class="head"><div><h1>Receipt Records</h1><p>Official receipts issued from the Bush Taxi payment ledger.</p></div></div><div class="card"><div class="search"><input id="rf" placeholder="Filter receipt records" oninput="filterRows(this.value)"></div><div class="tablewrap section"><table class="table" id="rt"><thead><tr><th>Receipt</th><th>Date</th><th>Member</th><th>Type</th><th>Amount</th><th>Method</th><th></th></tr></thead><tbody>${(d.receipts||[]).map(r=>`<tr><td><b>${r.receipt_number}</b></td><td>${dt(r.receipt_date)}</td><td>${esc([r.members?.first_names,r.members?.surname].filter(Boolean).join(' ')||r.members?.surname||r.received_from||'—')}</td><td>${esc(r.payment_type)}</td><td>${money(r.amount)}</td><td>${esc(r.payment_method)}</td><td><button class="btn" onclick='printReceipt(${JSON.stringify(r)})'>Print</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No receipts yet.</td></tr>'}</tbody></table></div></div>`,'Receipts')}function filterRows(q){q=q.toLowerCase();document.querySelectorAll('#rt tbody tr').forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?'':'none')}
function printReceipt(r){let w=open('','_blank','width=420,height=700');if(!w)return toast('Allow pop-ups to print');w.document.write(`<div class="print"><div class="c"><img src="${location.href.replace(/index\.html.*$/,'')}${logo}" style="width:60px;height:60px;object-fit:contain"><h2>BUSHBUCKRIDGE TAXI ASSOCIATION</h2><div>OFFICIAL PAYMENT RECEIPT</div></div><hr><table><tr><td>Receipt No.</td><td>${esc(r.receipt_number)}</td></tr><tr><td>Date</td><td>${esc(dt(r.receipt_date))}</td></tr><tr><td>Member</td><td>${esc([r.members?.first_names,r.members?.surname].filter(Boolean).join(' ')||r.received_from||'')}</td></tr><tr><td>Payment Type</td><td>${esc(r.payment_type)}</td></tr><tr><td>Method</td><td>${esc(r.payment_method)}</td></tr><tr><td><b>AMOUNT</b></td><td><b>${money(r.amount)}</b></td></tr></table><hr><div class="c">Thank you for your payment.<br><small>Bush Taxi Management System</small></div></div>`);w.document.close();setTimeout(()=>w.print(),250)}
async function penalties(){let d=await api('/penalties');shell(`<div class="head"><div><h1>Penalties</h1><p>Track penalties, balances and settlement status.</p></div></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Member</th><th>Vehicle</th><th>Reason</th><th>Amount</th><th>Paid</th><th>Outstanding</th><th>Status</th></tr></thead><tbody>${(d.penalties||[]).map(p=>`<tr><td>${esc([p.members?.first_names,p.members?.surname].filter(Boolean).join(' ')||p.members?.surname)}</td><td>${esc(p.vehicles?.registration_number||'—')}</td><td>${esc(p.reason)}</td><td>${money(p.amount)}</td><td>${money(p.amount_paid)}</td><td>${money(Number(p.amount)-Number(p.amount_paid))}</td><td><span class="badge ${p.status==='paid'?'ok':'warn'}">${esc(p.status)}</span></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No penalties recorded.</td></tr>'}</tbody></table></div></div>`,'Penalties')}
async function funeral(){let d=await api('/funeral-plans');shell(`<div class="head"><div><h1>Funeral Plans</h1><p>Manage funeral-plan memberships and balances.</p></div></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Member</th><th>Plan</th><th>Monthly Amount</th><th>Dependants</th><th>Balance</th><th>Status</th></tr></thead><tbody>${(d.funeral_plans||[]).map(p=>`<tr><td>${esc([p.members?.first_names,p.members?.surname].filter(Boolean).join(' ')||p.members?.surname)}</td><td>${esc(p.plan_name)}</td><td>${money(p.monthly_amount)}</td><td>${esc(p.dependants_count)}</td><td>${money(p.balance)}</td><td><span class="badge ${p.status==='active'?'ok':'warn'}">${esc(p.status)}</span></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No funeral plans recorded.</td></tr>'}</tbody></table></div></div>`,'Funeral Plans')}
async function reports(){let d=await api('/payments');let a=d.payments||[];let total=a.reduce((s,x)=>s+Number(x.amount||0),0);let methods={};a.forEach(x=>methods[x.payment_method]=(methods[x.payment_method]||0)+Number(x.amount||0));shell(`<div class="head"><div><h1>Reports</h1><p>Collections and payment-method analysis.</p></div></div><div class="cards"><div class="card metric"><div><div class="label">TOTAL COLLECTIONS</div><div class="num">${money(total)}</div></div></div><div class="card metric"><div><div class="label">PAYMENT COUNT</div><div class="num">${a.length}</div></div></div></div><div class="grid2"><div class="card"><h2>By Payment Method</h2>${Object.entries(methods).map(([k,v])=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #272b31;padding:12px 0"><b>${esc(k)}</b><b>${money(v)}</b></div>`).join('')||'<div class="empty">No data.</div>'}</div><div class="card"><h2>Database Status</h2><p class="muted">Bush Taxi data is isolated in schema <b>bush_taxi</b>.</p><p class="muted">API: <span class="badge ok">ONLINE</span></p></div></div>`,'Reports')}
async function go(p){page=p;try{if(p==='dashboard')return dashboard();if(p==='members')return members();if(p==='new-member')return newMember();if(p==='vehicles')return vehicles();if(p==='routes')return routesPage();if(p==='payments')return payments();if(p==='receipts')return receipts();if(p==='penalties')return penalties();if(p==='funeral')return funeral();if(p==='reports')return reports()}catch(e){toast(e.message)}}function render(){dashboard()}render();
</script></body></html>
